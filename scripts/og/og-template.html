<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: #ede7db; color: #1c1d1a;
    font-family: 'Onest', sans-serif;
    padding: 64px 64px 0;
    overflow: hidden;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; font-size: 17px;
          letter-spacing: 0.1em; text-transform: uppercase; color: #5e5d60; }
  h1 { font-size: 92px; line-height: 0.96; letter-spacing: -0.035em; font-weight: 500; margin-top: 26px; }
  h1 span { display: block; }
  h1 span:nth-child(2) { padding-left: 62px; }
  h1 span:nth-child(3) { padding-left: 124px; }
  .sub { margin-top: 22px; font-size: 25px; color: #3e4a63; }
  .strip { height: 150px; margin: 0 -64px; display: block; }
  .strip img { width: 100%; height: 150px; object-fit: cover; object-position: center 34%; display: block; }
</style>
</head>
<body>
  <div>
    <p class="mono">12–22 февраля 2027 · 11 дней / 10 ночей</p>
    <h1><span>Соль.</span><span>Рис.</span><span>Тишина.</span></h1>
    <p class="sub">Путешествие-практика по Бали и Гили Мено</p>
  </div>
  <div class="strip"><img src="../../bali/images/hero-ocean.jpg" alt=""></div>
</body>
</html>
